    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: orange;
            padding: 15px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: black;
        }

        .navbar {
            background-color: pink;
            padding: 12px;
            text-align: center;
        }

        .navbar a {
            text-decoration: none;
            color: black;
            margin: 0 25px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: blue;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background-color: lightblue;
            color: black;
            padding: 12px;
            border: 1px solid black;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid black;
        }

        .total {
            font-weight: bold;
            background-color: lightgreen;
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>ONLINE BOOK STORE</h1>
    </div>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Login</a>
        <a href="#">Registration</a>
        <a href="#">Catalogue</a>
        <a href="#">Cart</a>
    </div>

    <div class="container">

        <h2>Shopping Cart</h2>

        <table>

            <tr>
                <th>Book Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Amount</th>
            </tr>

            <tr>
                <td>Java 2</td>
                <td>$45</td>
                <td>2</td>
                <td>$90</td>
            </tr>

            <tr>
                <td>XML Bible</td>
                <td>$20</td>
                <td>1</td>
                <td>$20</td>
            </tr>

            <tr>
                <td>HTML in 24 Hours</td>
                <td>$25</td>
                <td>2</td>
                <td>$50</td>
            </tr>

            <tr>
                <td>Web Designing</td>
                <td>$30</td>
                <td>1</td>
                <td>$30</td>
            </tr>

            <tr class="total">
                <td colspan="3">TOTAL AMOUNT</td>
                <td>$190</td>
            </tr>

        </table>

    </div>

</body>

</html>
