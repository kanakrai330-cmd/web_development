<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Page</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border: 2px solid black;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"] {
            width: 300px;
            padding: 8px;
            border: 1px solid gray;
        }

        select {
            padding: 7px;
        }

        textarea {
            width: 300px;
            height: 80px;
            padding: 8px;
            vertical-align: top;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 25px;
            margin: 10px;
            border: none;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
        }

        input[type="reset"] {
            background-color: red;
            color: white;
        }

        .buttons {
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <form>

            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   required>
            <br>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   required>
            <br>

            <!-- Email -->
            <label for="email">E-mail ID:</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>
            <br>

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   required>
            <br>

            <!-- Sex -->
            <label>Sex:</label>

            <input type="radio"
                   id="male"
                   name="sex"
                   value="Male">

            <label for="male"
                   style="width:auto;">
                Male
            </label>

            <input type="radio"
                   id="female"
                   name="sex"
                   value="Female">

            <label for="female"
                   style="width:auto;">
                Female
            </label>

            <br><br>

            <!-- Date of Birth -->
            <label>Date of Birth:</label>

            <select name="day">
                <option>Day</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>
            </select>

            <select name="month">
                <option>Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
            </select>

            <select name="year">
                <option>Year</option>
                <option>2000</option>
                <option>2001</option>
                <option>2002</option>
                <option>2003</option>
                <option>2004</option>
                <option>2005</option>
                <option>2006</option>
                <option>2007</option>
            </select>

            <br><br>

            <!-- Languages -->
            <label>Languages Known:</label>

            <input type="checkbox"
                   name="language"
                   value="English">
            English

            <input type="checkbox"
                   name="language"
                   value="Telugu">
            Telugu

            <input type="checkbox"
                   name="language"
                   value="Hindi">
            Hindi

            <input type="checkbox"
                   name="language"
                   value="Tamil">
            Tamil

            <br><br>

            <!-- Address -->
            <label for="address">Address:</label>

            <textarea id="address"
                      name="address"></textarea>

            <br><br>

            <!-- Buttons -->
            <div class="buttons">

                <input type="submit"
                       value="Submit">

                <input type="reset"
                       value="Reset">

            </div>

        </form>

    </div>

</body>

</html>
